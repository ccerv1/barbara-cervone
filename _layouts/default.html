<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {% if site.title and site.title != page.title %}
      <p style="font-size: 0.85em; color: #666;">
        <a href="{{ "/" | absolute_url }}">{{ site.title }}</a>
        &nbsp;&middot;&nbsp; <a href="{{ "/progressive-education/" | absolute_url }}">Progressive Education</a>
        &nbsp;&middot;&nbsp; <a href="{{ "/essays/" | absolute_url }}">Essays & Speeches</a>
        &nbsp;&middot;&nbsp; <a href="{{ "/work/" | absolute_url }}">Work & Publications</a>
      </p>
      {% endif %}

      {{ content }}

      <hr>
      <p style="font-size: 0.85em; color: #666;">
        <a href="{{ "/" | absolute_url }}">Home</a>
        &nbsp;&middot;&nbsp; <a href="{{ "/progressive-education/" | absolute_url }}">Progressive Education</a>
        &nbsp;&middot;&nbsp; <a href="{{ "/essays/" | absolute_url }}">Essays & Speeches</a>
        &nbsp;&middot;&nbsp; <a href="{{ "/work/" | absolute_url }}">Work & Publications</a>
      </p>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
  </body>
</html>
