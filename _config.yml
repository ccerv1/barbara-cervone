# Theme
remote_theme: jekyll-theme-minimal
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Basics
title: Barbara Cervone
# Deliberately empty: jekyll-seo-tag appends a site description to the home
# page title ("Barbara Cervone | <description>"). It must be an empty string,
# not absent, or GitHub Pages fills it in from the GitHub repo's "About" text.
# Each page sets its own description in front matter.
description: ""
url: https://barbaracervone.org
baseurl: ""
lang: en

# SEO / social
author:
  name: Barbara Cervone
  url: https://barbaracervone.org

social:
  name: Barbara Cervone
  links:
    - https://www.whatkidscando.org
    - https://www.postcards-from-the-rogue-valley.blog/

logo: /assets/img/barbara-cervone.JPG

# Default page metadata
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/barbara-cervone.JPG
